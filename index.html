<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Landing Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="title">
                <h1>Home Page</h1>
            </div>
        </header>
        <form id="contacts" novalidate>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" name="name" required>
                <span class="error" id="nameError"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error" id="emailError"></span>
            </div>    
            <div class="form-group">
                <label>Phone number</label>
                <input type="tel" id="phone" name="phone" placeholder="+23058534493" required>
                <span class="error" id="phoneError"></span>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" required>
                <ul class="password-rules" id="passwordRules">
                    <li id="ruleLength">At least 8 characters long</li>
                    <li id="ruleUppercase">At least one uppercase letter</li>
                    <li id="ruleNumber">At least one number</li>
                    <li id="ruleSpecial">At least one special character</li>
                </ul>
            </div>   

            <button type="submit">Submit</button>
        
            </form>

            <div class="modal-overlay" id="modalOverlay">
                <div class="modal-box">
                    <h2>Form submitted successfully!</h2>
                    <button id="closeModalBtn" class="close-btn">Return to home page</button>
                </div>
            </div>
            
        <footer>
            <p>&copy; 2023 My Landing Page. All rights reserved.</p>
            <div class="social-links">
                <a href="#"> Twitter</a>
                <a href="#"> LinkedIn</a>
                <a href="#"> Instagram</a>
                <a href="#"> GitHub</a>
            </div>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
